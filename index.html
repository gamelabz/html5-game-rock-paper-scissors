<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>✊ Rock Paper Scissors</h1>
      <p class="tagline">Out-guess the AI in this timeless showdown.</p>
    </header>

    <section class="hud" aria-label="Game statistics">
      <div class="stat"><span class="stat-label">Win</span><span class="stat-value" id="wins">0</span></div>
      <div class="stat"><span class="stat-label">Lose</span><span class="stat-value" id="losses">0</span></div>
      <div class="stat"><span class="stat-label">Draw</span><span class="stat-value" id="draws">0</span></div>
    </section>

    <div class="stage">
      <canvas id="game" width="420" height="220"></canvas>
      <p class="message" id="message">Choose your hand!</p>
    </div>

    <footer class="controls">
      <button class="btn hand" data-h="rock">✊ Rock</button>
      <button class="btn hand" data-h="paper">✋ Paper</button>
      <button class="btn hand" data-h="scissors">✌️ Scissors</button>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
